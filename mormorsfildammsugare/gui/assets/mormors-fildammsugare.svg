<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3daee9"/>
      <stop offset="100%" stop-color="#1d99f3"/>
    </linearGradient>
    <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31363b"/>
      <stop offset="100%" stop-color="#232629"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f67400"/>
      <stop offset="100%" stop-color="#fd971f"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background circular badge for desktop dock -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="#24272c" stroke="#31363b" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Swirl / Vacuum Vortex lines -->
  <path d="M 64 68 C 80 50, 110 46, 140 54 C 175 62, 196 92, 188 128 C 182 155, 158 174, 130 170 C 108 167, 92 148, 98 128 C 102 114, 116 104, 130 108" 
        fill="none" stroke="#3daee9" stroke-width="5" stroke-linecap="round" opacity="0.35" stroke-dasharray="8 6"/>

  <!-- Vacuum cleaner canister body -->
  <ellipse cx="140" cy="148" rx="58" ry="46" fill="url(#canisterGrad)" stroke="#4d545b" stroke-width="3"/>
  <ellipse cx="140" cy="140" rx="46" ry="34" fill="url(#bodyGrad)"/>

  <!-- Canister highlights & bumper -->
  <path d="M 94 148 C 96 172, 120 186, 150 186 C 178 186, 196 170, 194 148" fill="none" stroke="#232629" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="140" cy="132" rx="30" ry="16" fill="#60c0f8" opacity="0.5"/>

  <!-- Big vacuum wheel -->
  <circle cx="178" cy="164" r="24" fill="#1b1e20" stroke="#4d545b" stroke-width="4"/>
  <circle cx="178" cy="164" r="14" fill="#31363b"/>
  <circle cx="178" cy="164" r="6" fill="#f67400"/>

  <!-- Suction Hose -->
  <path d="M 98 136 C 68 126, 44 148, 48 180 C 50 196, 68 206, 92 198" fill="none" stroke="#7f8c8d" stroke-width="12" stroke-linecap="round"/>
  <path d="M 98 136 C 68 126, 44 148, 48 180 C 50 196, 68 206, 92 198" fill="none" stroke="#31363b" stroke-width="10" stroke-linecap="round" stroke-dasharray="3 5"/>

  <!-- Triage / Files being sucked into vacuum -->
  <!-- Photo Card -->
  <g transform="translate(42, 60) rotate(-18)">
    <rect x="0" y="0" width="44" height="34" rx="4" fill="#fcfcfc" stroke="#bdc3c7" stroke-width="2" filter="url(#dropShadow)"/>
    <rect x="4" y="4" width="36" height="22" rx="2" fill="#27ae60"/>
    <circle cx="14" cy="11" r="3" fill="#f1c40f"/>
    <polygon points="6,24 16,15 24,21 34,13 38,24" fill="#2ecc71"/>
  </g>

  <!-- Document Card -->
  <g transform="translate(86, 38) rotate(12)">
    <path d="M 0 0 L 26 0 L 36 10 L 36 46 L 0 46 Z" fill="#eff0f1" stroke="#bdc3c7" stroke-width="2"/>
    <polygon points="26,0 36,10 26,10" fill="#bdc3c7"/>
    <line x1="6" y1="16" x2="22" y2="16" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="24" x2="30" y2="24" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="31" x2="26" y2="31" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="38" x2="18" y2="38" stroke="#7f8c8d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Duplicate Badge / Sparkles -->
  <g transform="translate(162, 54)">
    <circle cx="16" cy="16" r="16" fill="url(#accentGrad)" filter="url(#dropShadow)"/>
    <!-- Deduplication / cleaner broom spark -->
    <path d="M 16 6 L 18 13 L 25 15 L 19 19 L 20 26 L 15 21 L 9 24 L 12 18 L 7 13 L 14 12 Z" fill="#ffffff"/>
  </g>
</svg>
